<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnonimaX — Anonimizador de documentos en tu navegador</title>
    <meta name="description" content="Oculta nombres, DNI, domicilios y cuentas bancarias de tus documentos Word, PDF, TXT, CSV, JSON y XML sin subirlos a ningún servidor." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" />
    <!-- Se ejecuta antes de dibujar la página: evita el "parpadeo" del tema -->
    <script>
      (function () {
        var raiz = document.documentElement;
        raiz.classList.add('js');
        var tema = 'dark';
        try { tema = localStorage.getItem('anonimax-tema') || tema; } catch (e) {}
        raiz.setAttribute('data-theme', tema);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
